name: Playwright Allure Reporting Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    env:
      CI: true
      HEADLESS: true

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. IMPORTANT: Install Playwright Browsers and Dependencies
      - name: Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps

      # 5. Run Playwright Tests with Allure Reporter
      - name: Run Playwright Tests
        run: npx playwright test --reporter=line,allure-playwright
        continue-on-error: true

      # 6. Check Allure Results
      - name: Check Allure Results
        if: always()
        run: |
          echo "=== Allure Results Status ==="
          RESULT_COUNT=$(find allure-results -name "*.json" 2>/dev/null | wc -l)
          echo "✓ Found $RESULT_COUNT Allure result files"
          ls -la allure-results/ 2>/dev/null | head -20 || echo "⚠ No allure-results directory"

      # 7. Restore Allure History for Trend Charts
      - name: Restore Allure History
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Preserve History for Trends
        if: always()
        run: |
          mkdir -p allure-results/history
          if [ -d "../gh-pages-history/history" ]; then
            echo "✓ Restoring previous history for trend charts..."
            cp -r ../gh-pages-history/history/* allure-results/history/ 2>/dev/null || true
          else
            echo "ℹ First run — no history available yet"
          fi

      # 8. Generate Allure Report
      - name: Generate Allure Report with simple-elf
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # 9. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: false
          keep_files: false

      # 10. Output Report URL
      - name: Generate Report Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  🎭 Playwright + Allure Report"
          echo "=========================================="
          REPO_OWNER=$(echo '${{ github.repository }}' | cut -d/ -f1)
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          echo "📊 Report URL: https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          echo "🌳 Branch: ${{ github.ref_name }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "⏰ Timestamp: $(date)"
          echo "=========================================="
