name: Playwright Automation CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    env:
      CI: true
      HEADLESS: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Install Allure CLI for report generation
      - name: Install Allure CLI
        run: |
          curl -o allure-2.27.0.tgz -OLs https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -zxvf allure-2.27.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure
          allure --version

      # Run Smoke/Critical Tests (if available)
      - name: Run Marked Tests
        run: npx playwright test
        continue-on-error: true

      - name: Check Allure Results
        if: always()
        run: |
          echo "=== Allure Results Check ==="
          RESULT_COUNT=$(find allure-results -name "*.json" 2>/dev/null | wc -l)
          echo "Found $RESULT_COUNT Allure result files"
          ls -la allure-results/ 2>/dev/null | head -30 || echo "No allure-results directory found"

      # Restore previous history BEFORE generating the report (enables Trend chart)
      - name: Restore Allure History
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Copy History Into Results
        if: always()
        run: |
          mkdir -p allure-results/history
          if [ -d "../gh-pages-history/history" ]; then
            echo "Restoring previous history for trend charts..."
            cp -r ../gh-pages-history/history/* allure-results/history/ 2>/dev/null || true
            echo "History restored:"
            ls -la allure-results/history/
          else
            echo "No previous history found — this is likely the first run."
          fi

      # Generate report using Allure CLI
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report
          echo "Report generated:"
          ls -la allure-report/

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: false
          keep_files: false

      - name: Report Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  Playwright Test Execution & Report"
          echo "=========================================="
          REPO_OWNER=$(echo '${{ github.repository }}' | cut -d/ -f1)
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          echo "📊 Report URL: https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Timestamp: $(date)"
          echo "==========================================="
